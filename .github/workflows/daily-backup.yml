name: Daily article backup

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-article-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY repository secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS repository secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Export published articles from the server
        id: export
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          : "${DEPLOY_HOST:?Set the DEPLOY_HOST repository secret}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER repository secret}"
          : "${DEPLOY_PATH:?Set the DEPLOY_PATH repository secret}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          backup_date="$(date -u +%F)"
          backup_id="$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "backup_id=$backup_id" >> "$GITHUB_OUTPUT"
          echo "backup_date=$backup_date" >> "$GITHUB_OUTPUT"

          ssh "${ssh_args[@]}" "$target" \
            "mkdir -p '$DEPLOY_PATH/scripts' '$DEPLOY_PATH/backup-output'"
          scp "${ssh_args[@]}" compose.yaml "$target:$DEPLOY_PATH/"
          scp "${ssh_args[@]}" scripts/backup_articles.py \
            "$target:$DEPLOY_PATH/scripts/"
          ssh "${ssh_args[@]}" "$target" \
            "cd '$DEPLOY_PATH' && docker compose run --rm --no-deps article-backup --output '/output/$backup_id'"
          mkdir -p "$RUNNER_TEMP/article-backup"
          scp "${ssh_args[@]}" -r \
            "$target:$DEPLOY_PATH/backup-output/$backup_id" \
            "$RUNNER_TEMP/article-backup/"

      - name: Commit backup to article-backups branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_ID: ${{ steps.export.outputs.backup_id }}
          BACKUP_DATE: ${{ steps.export.outputs.backup_date }}
        run: |
          askpass="$RUNNER_TEMP/git-askpass"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token ;;
            *Password*) echo "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          repo="$RUNNER_TEMP/backup-repo"
          git init "$repo"
          git -C "$repo" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C "$repo" ls-remote --exit-code --heads origin article-backups >/dev/null 2>&1; then
            git -C "$repo" fetch origin article-backups
            git -C "$repo" checkout -b article-backups FETCH_HEAD
          else
            git -C "$repo" checkout --orphan article-backups
          fi

          mkdir -p "$repo/backups/$BACKUP_DATE"
          cp -a "$RUNNER_TEMP/article-backup/$BACKUP_ID" "$repo/backups/$BACKUP_DATE/$BACKUP_ID"
          git -C "$repo" config user.name "github-actions[bot]"
          git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo" add "backups/$BACKUP_DATE/$BACKUP_ID"
          git -C "$repo" commit -m "Back up published articles $BACKUP_ID"
          git -C "$repo" push origin article-backups

      - name: Remove temporary server export
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKUP_ID: ${{ steps.export.outputs.backup_id }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          ssh "${ssh_args[@]}" "$target" \
            "cd '$DEPLOY_PATH' && docker compose run --rm --no-deps --entrypoint rm article-backup -rf -- '/output/$BACKUP_ID'"
