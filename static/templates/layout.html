<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} · {{end}}Go-SQLite-Blog</title>
    <style>
        :root {
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f9fafb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.65;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .site-header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .site-header .inner {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 1.25rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .brand:hover { text-decoration: none; color: var(--accent); }
        nav { display: flex; align-items: center; gap: 1rem; font-size: 0.95rem; }
        nav .user { color: var(--muted); font-size: 0.9rem; }
        nav form.inline { margin: 0; }
        nav button.link {
            background: none;
            border: none;
            padding: 0;
            color: var(--accent);
            font: inherit;
            cursor: pointer;
        }
        nav button.link:hover { text-decoration: underline; }

        .container {
            flex: 1;
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }

        h1 { font-size: 1.6rem; margin: 0 0 1.25rem; letter-spacing: -0.02em; }
        h2 { font-size: 1.2rem; margin: 0 0 0.5rem; }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
        }
        .card + .card { margin-top: 1rem; }

        .auth-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 420px;
            margin: 1.5rem auto 0;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
        }
        .auth-card h1 { font-size: 1.35rem; text-align: center; margin-bottom: 1.5rem; }
        .hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin: 1.25rem 0 0; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], input[type="password"], input[type="email"], textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            font-size: 0.95rem;
            background: #fff;
            color: var(--text);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        textarea { resize: vertical; min-height: 260px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            border: 1px solid transparent;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: var(--text);
            border-color: var(--border);
        }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; }
        .btn.primary:hover { background: var(--accent-dark); }
        .btn.small { padding: 0.3rem 0.7rem; font-size: 0.85rem; font-weight: 500; }
        .btn-row { margin-top: 1.25rem; display: flex; gap: 0.6rem; align-items: center; }

        .alert {
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin: 0 0 1rem;
        }
        .alert.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }

        .article-item { padding: 1.15rem 1.25rem; }
        .article-item + .article-item { border-top: 1px solid var(--border); }
        .article-item h2 a { color: var(--text); }
        .article-item h2 a:hover { color: var(--accent); text-decoration: none; }
        .excerpt { color: var(--muted); margin: 0.35rem 0 0; font-size: 0.95rem; }
        .meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
        .article-body {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1rem;
            margin: 1.25rem 0 0;
        }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.05rem 0.45rem;
            border-radius: 999px;
            background: #fef3c7;
            color: #92400e;
            vertical-align: middle;
            margin-left: 0.4rem;
        }
        .empty { color: var(--muted); text-align: center; padding: 2.5rem 1rem; }

        .site-footer {
            border-top: 1px solid var(--border);
            background: #fff;
            color: var(--muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 1.25rem;
        }
        .site-footer p { margin: 0; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="inner">
            <a class="brand" href="/">Go-SQLite-Blog</a>
            <nav>
                <a href="/">首页</a>
                <a href="/post/new">发文章</a>
                {{if .LoggedIn}}
                    <span class="user">你好，{{.Username}}</span>
                    <form class="inline" method="POST" action="/logout">
                        <button class="link" type="submit">退出</button>
                    </form>
                {{else}}
                    <a href="/login">登录</a>
                    <a href="/register">注册</a>
                {{end}}
            </nav>
        </div>
    </header>
    <main class="container">
        {{template "content" .}}
    </main>
    <footer class="site-footer">
        <p>Powered by Go · net/http · SQLite</p>
    </footer>
</body>
</html>
