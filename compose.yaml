services:
  blog:
    image: ghcr.io/bie33333/go-sqlite-blog:latest
    restart: unless-stopped
    ports:
      - "${BLOG_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: INFO
      DATABASE_SOURCE: /data/blog.db
    volumes:
      - blog-data:/data
      - blog-uploads:/app/static/uploads

volumes:
  blog-data:
  blog-uploads:
